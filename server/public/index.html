<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRL⇄PGN Converter</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
      textarea { width: 100%; height: 240px; }
      pre { background: #f5f5f5; padding: 1rem; overflow:auto; }
      .row { display:flex; gap: 1rem; align-items: center; }
      .row > * { flex: 1; }
      .btn { padding: .5rem 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>TRL ⇄ PGN Converter</h1>
    <p>Paste text or upload a file, then convert on the server.</p>

    <div>
      <div class="row">
        <label><input type="radio" name="mode" value="pgn" checked /> PGN → TRL</label>
        <label><input type="radio" name="mode" value="trl" /> TRL → PGN</label>
      </div>
      <textarea id="input" placeholder="Paste PGN or TRL here..."></textarea>
      <div class="row">
        <input id="file" type="file" />
        <button id="upload" class="btn">Upload & Convert</button>
        <button id="convert" class="btn">Convert Text</button>
      </div>
      <h3>Output</h3>
      <pre id="output"></pre>
    </div>

    <script>
      const $ = (s)=>document.querySelector(s);
      function mode(){ return document.querySelector('input[name="mode"]:checked').value; }
      $('#convert').onclick = async ()=>{
        const data = $('#input').value;
        const inputType = mode();
        const res = await fetch('/api/convert', { method:'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ inputType, data }) });
        const json = await res.json();
        if(!res.ok){ $('#output').textContent = 'Error: ' + (json.error||res.statusText); return; }
        $('#output').textContent = json.output;
      };
      $('#upload').onclick = async ()=>{
        const f = $('#file').files[0];
        if(!f) { alert('Choose a file'); return; }
        const fd = new FormData();
        fd.append('file', f);
        fd.append('inputType', mode());
        const res = await fetch('/api/convert-upload', { method:'POST', body: fd });
        const text = await res.text();
        $('#output').textContent = text;
      };
    </script>
  </body>
</html>
