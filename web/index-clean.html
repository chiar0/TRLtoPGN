<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TRL ⇄ PGN Viewer</title>
  
  <!-- Styles -->
  <link rel="stylesheet" href="./src/styles/main.css">
  
  <!-- External dependencies -->
  <script type="module" src="https://unpkg.com/chessboard-element?module"></script>
  <script type="importmap">
    {
      "imports": {
        "fs": "./shims/fs.js",
        "path": "./shims/path.js"
      }
    }
  </script>
  <script>
    // Minimal Node global shim so CLI guards in modules don't explode
    window.process = { argv: [], exit: function(){}, env: {} };
  </script>
</head>
<body>
  <header>
    <div class="container">
      <div class="row" style="align-items:baseline; gap:12px;">
        <h1 style="margin:0;">TRL ⇄ PGN Viewer</h1>
        <span class="small" style="opacity:.9;">Convert and replay Kriegspiel and Chess</span>
      </div>
    </div>
  </header>
  
  <main>
    <div id="grid" class="container grid">
      <section id="converterPanel" class="panel">
        <div id="originalWrap" class="preview">
          <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span class="tag" id="originalTag">Auto‑detect Input</span>
            <div class="row" style="gap:6px;">
              <label class="btn ghost" for="file" title="Load file">📂</label>
              <input id="file" type="file" accept=".pgn,.trl,.txt" />
              <button id="copyOriginal" class="btn ghost" title="Copy original">Copy</button>
              <button id="downloadOriginal" class="btn" title="Download original">Download</button>
              <button id="clearInput" class="btn ghost" title="Clear input">Clear</button>
            </div>
          </div>
          <textarea id="input" placeholder="Paste PGN or TRL here..."></textarea>
          <div class="row" style="align-items:center; gap:8px; margin-top:6px;">
            <button id="toggleEditorOriginal" class="btn ghost tiny" title="Edit PGN headers" style="display:none;">Editor</button>
            <div id="originalInfo" class="small"></div>
          </div>
        </div>
        
        <div id="convertedWrap" class="preview" style="display:none;">
          <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span class="tag" id="outputTag">Converted</span>
            <div class="row" style="gap:6px;">
              <button id="copyConverted" class="btn ghost">Copy</button>
              <button id="downloadConverted" class="btn">Download</button>
            </div>
          </div>
          <textarea id="outputPreview" readonly placeholder="Converted output will appear here..."></textarea>
          
          <div id="pgnEditor" style="display:none; margin-top:8px;">
            <div class="row" style="gap:12px; flex-wrap:wrap; margin-bottom:8px;">
              <label class="small" style="display:flex; flex-direction:column; gap:4px;">
                <span>Event</span>
                <input id="pgnEvent" class="btn" style="padding:8px 10px; min-width:220px;" placeholder="Client Game" />
              </label>
              <label class="small" style="display:flex; flex-direction:column; gap:4px;">
                <span>Site</span>
                <input id="pgnSite" class="btn" style="padding:8px 10px; min-width:200px;" placeholder="Local" />
              </label>
              <label class="small" style="display:flex; flex-direction:column; gap:4px;">
                <span>Date</span>
                <input id="pgnDate" class="btn" style="padding:8px 10px; min-width:150px;" placeholder="YYYY.MM.DD" />
              </label>
              <label class="small" style="display:flex; flex-direction:column; gap:4px;">
                <span>White</span>
                <input id="pgnWhite" class="btn" style="padding:8px 10px; min-width:160px;" placeholder="Player 1" />
              </label>
              <label class="small" style="display:flex; flex-direction:column; gap:4px;">
                <span>Black</span>
                <input id="pgnBlack" class="btn" style="padding:8px 10px; min-width:160px;" placeholder="Player 2" />
              </label>
              <label class="small" style="display:flex; flex-direction:column; gap:4px;">
                <span>Variant</span>
                <select id="pgnVariant" class="btn" style="padding:8px 10px; min-width:160px;">
                  <option value="chess" selected>Chess</option>
                  <option value="kriegspiel">Kriegspiel</option>
                </select>
              </label>
            </div>
          </div>
          
          <div class="row" style="align-items:center; gap:8px; margin-top:6px;">
            <button id="toggleEditor" class="btn ghost tiny" title="Edit PGN headers" style="display:none;">Editor</button>
            <div id="outputInfo" class="small"></div>
          </div>
        </div>
        
        <div class="row" style="margin-top:8px">
          <button id="start" class="btn primary">Start ▶</button>
          <button id="shareLink" class="btn">Share Link</button>
          <span class="spacer"></span>
          <button id="toggleConverter" class="btn ghost" title="Hide or show the converter">Hide Converter</button>
          <span id="status" class="small"></span>
        </div>
        
        <div id="settingsPanel" class="preview" style="display:none; margin-top:8px;">
          <div class="row" style="gap:16px; align-items:center; flex-wrap:wrap;">
            <label class="small" style="display:flex; align-items:center; gap:6px;">
              <span>Share compression</span>
              <select id="compressionSelect" class="btn" style="padding:8px 10px;">
                <option value="auto" selected>Auto</option>
                <option value="none">None</option>
                <option value="gzip">Gzip</option>
                <option value="deflate">Deflate</option>
              </select>
            </label>
            <label class="small" style="display:flex; align-items:center; gap:6px;">
              <span>Format</span>
              <select id="shareFormatSelect" class="btn" style="padding:8px 10px;">
                <option value="pgn" selected>PGN</option>
                <option value="trl">TRL</option>
              </select>
            </label>
          </div>
          <div id="shareLinkWrap" class="preview" style="margin-top:8px; display:none;">
            <input id="shareLinkBox" class="btn" style="width:100%; padding:8px 10px;" readonly value="" />
          </div>
        </div>
      </section>
      
      <section id="boardPanel" class="panel">
        <div class="row boardRow">
          <div class="leftCol">
            <div class="row" id="replayTopBar" style="justify-content:space-between; align-items:center; gap:6px; width:100%; margin-bottom:6px;">
              <div id="topLeftInfo" class="row small" style="gap:6px;"></div>
              <div class="row" style="gap:6px;">
                <button id="replaySettingsBtn" class="btn ghost" title="Replay settings">⚙️</button>
                <button id="engineToggleBtn" class="btn ghost" title="Engine analysis">⚡</button>
                <span id="engineThinkingBadge" class="small" style="display:none; opacity:.9;">thinking…</span>
                <button id="showMovesTop" class="btn ghost" title="Show moves" style="display:none;">Show Moves</button>
              </div>
            </div>
            
            <div id="boardHeaderBar" class="metaBar" title="Click to edit PGN headers" style="display:none; margin-bottom:8px;">
              <div class="metaPlayers">
                <span class="name">
                  <span class="badge badge-white" aria-hidden="true"></span>
                  <span id="metaWhite">White</span>
                </span>
                <span class="vs">vs</span>
                <span class="name">
                  <span class="badge badge-black" aria-hidden="true"></span>
                  <span id="metaBlack">Black</span>
                </span>
              </div>
              <div class="metaInfo" id="metaInfo">Event • Date • Site</div>
              <div class="small" style="opacity:.85;" aria-hidden="true">✎</div>
            </div>
            
            <div id="replaySettingsMenu" class="preview" style="display:none; margin:8px 0; width:100%;">
              <div class="row" style="gap:16px; align-items:center; flex-wrap:wrap;">
                <label class="small">
                  <input type="checkbox" id="hideOpp" style="margin-right:6px">Hide opponent pieces
                </label>
                <label class="small">
                  <input type="checkbox" id="skipIllegal" style="margin-right:6px">Skip illegal attempts
                </label>
                <label class="small">
                  <input type="checkbox" id="latestOnly" style="margin-right:6px">Single attempt (auto-hide)
                </label>
                <label class="small">
                  <input type="checkbox" id="showRaw" style="margin-right:6px">Show raw move
                </label>
                <label class="small">
                  <input type="checkbox" id="showDetails" style="margin-right:6px">Show details under moves
                </label>
              </div>
            </div>
            
            <div id="enginePanel" class="preview" style="display:none; margin:8px 0; width:100%;">
              <div class="row" style="gap:8px; align-items:center; flex-wrap:wrap;">
                <label class="small" style="display:flex; align-items:center; gap:6px;">
                  <input type="checkbox" id="engineLog" style="margin-right:6px">Show engine log
                </label>
                <label class="small" style="display:flex; align-items:center; gap:6px;">
                  <input type="checkbox" id="engineWaitBase" style="margin-right:6px" checked>Wait at base speed
                </label>
                <label class="small">
                  Depth <input id="engineDepth" class="btn" style="padding:6px 8px; min-width:64px;" value="12" />
                </label>
                <label class="small">
                  Time(ms) <input id="engineTime" class="btn" style="padding:6px 8px; min-width:80px;" value="200" />
                </label>
                <button id="engineStart" class="btn tiny">Start</button>
                <button id="engineStop" class="btn tiny ghost" style="display:none">Stop</button>
                <div style="margin-left:8px; display:flex; gap:8px; align-items:center;">
                  <div id="engineStatus" class="small" style="min-width:200px;">Engine: stopped</div>
                </div>
                <div style="margin-top:8px;">
                  <div id="engineExplain" class="small" style="white-space:pre-wrap; color:#cbd5e1; font-size:12px; display:none"></div>
                </div>
              </div>
            </div>
            
            <div class="board-wrap" style="position:relative;">
              <chess-board id="board"></chess-board>
              <svg id="overlay" class="overlay"></svg>
              <div class="flipDock">
                <button id="flip" class="btn ghost" title="Flip board" aria-label="Flip">⇄</button>
              </div>
              <div id="converterRestoreWrap" style="display:none; position:absolute; left:0; top:100%; margin-top:8px;">
                <button id="restoreConverter" class="btn ghost" title="Show converter">Show Converter</button>
              </div>
            </div>
            
            <div class="toolbar">
              <button id="backAll" class="btn ghost" title="Go to start">⏮</button>
              <button id="back" class="btn ghost" title="Step back">‹</button>
              <button id="revPlay" class="btn rev" title="Play backward">
                ⯇<span id="revSpeedLabel" class="subLabel" style="display:none"></span>
              </button>
              <button id="stop" class="btn stop" title="Stop" style="display:none">■</button>
              <button id="play" class="btn play" title="Play forward">
                ⯈<span id="playSpeedLabel" class="subLabel" style="display:none"></span>
              </button>
              <button id="forward" class="btn ghost" title="Step forward">›</button>
              <button id="forwardAll" class="btn ghost" title="Go to end">⏭</button>
            </div>
            
            <div id="currentComment" class="small" style="text-align:center; margin-top:6px;"></div>
          </div>
          
          <div id="sideCol" class="sideCol">
            <div id="rawWrap" class="preview" style="display:none; margin-bottom:8px;">
              <div class="small" id="rawMove"></div>
            </div>
            
            <div id="movesPanel" class="panel">
              <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:6px;">
                <div id="movesTitle" class="small" style="opacity:.8;">Moves</div>
                <div class="row" style="gap:6px;">
                  <button id="toggleMoves" class="btn ghost" title="Hide moves">Hide Moves</button>
                </div>
              </div>
              <div id="moves"></div>
              
              <div id="detailsWrap" style="display:none; margin-top:8px;">
                <div id="meta" class="small" style="line-height:1.4"></div>
                <div id="umpire" class="small" style="margin-top:10px; line-height:1.4"></div>
                <div id="chat" class="chat"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  
  <footer>
    Built for client‑side use. No server required.
  </footer>

  <!-- Main application script -->
  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
