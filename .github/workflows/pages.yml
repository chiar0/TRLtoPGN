name: Deploy Web Client to GitHub Pages

on:
  push:
    branches: [ web-client, main, master ]
    paths:
      - 'web/**'
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'trl-to-pgn.ts'
      - 'pgn-to-trl.ts'
      - 'TRLtoPGN.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build TypeScript and vendor Stockfish
        run: npm run web:build

      - name: Prepare Pages artifact
        run: |
          rm -rf docs
          mkdir -p docs
          cp -R web/* docs/
          touch docs/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
